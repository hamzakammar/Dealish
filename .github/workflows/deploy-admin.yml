name: Deploy Admin Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: admin

      - name: Build
        run: |
          # Ensure the public client vars are present for `next build` inlining,
          # both via shell env and the env file Vercel/Next loads. Values come from
          # the env block below (masked secrets), not literals.
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\nNEXT_PUBLIC_SUPABASE_ANON_KEY=%s\nNEXT_PUBLIC_GOOGLE_MAPS_API_KEY=%s\n' \
            "$NEXT_PUBLIC_SUPABASE_URL" "$NEXT_PUBLIC_SUPABASE_ANON_KEY" "$NEXT_PUBLIC_GOOGLE_MAPS_API_KEY" \
            >> .vercel/.env.production.local
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: admin
        env:
          # NEXT_PUBLIC_* are inlined at build time. Provide them explicitly so the
          # build never ships with an undefined Supabase client (which throws
          # "supabaseUrl is required." and breaks login) if the Vercel project env
          # is missing/mis-scoped. These are public client values.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: admin
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
